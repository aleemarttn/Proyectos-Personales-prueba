# Configuración para desplegar en Netlify.
# Sirve tanto si subes la carpeta "dist" a mano como si conectas tu cuenta de GitHub.

[build]
  command = "npm run build"
  publish = "dist"

# Asegura que cualquier dirección interna (/gastos, /perfil, etc.) cargue la app
# en lugar de dar un error "Página no encontrada" al recargar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad para todas las rutas. connect-src incluye Supabase
# (API + Auth, llamado directo desde el navegador) y Open Food Facts
# (src/lib/barcode.js hace fetch directo al escanear un código de barras).
# NO hace falta permitir generativelanguage.googleapis.com: Gemini solo se
# llama desde las Edge Functions, nunca desde el frontend.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://world.openfoodfacts.org; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
